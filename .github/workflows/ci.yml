name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  LLAMA_CPP_COMMIT: f0c41e0168dfd4b5ef72b21d1a311b24cc7a894a

jobs:
  text:
    name: text (python + licenses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python syntax check
        run: |
          python -m py_compile tools/text_sidecar.py
          python -m py_compile frontend/frontend.py frontend/gsv_bert_tokenizer.py frontend/sync_frontend.py
          python -m py_compile tools/export_gguf/export.py
          python -m py_compile tools/export_resampy_filter.py
          python -m py_compile scripts/package_windows.py
          python -c "import sys; sys.path.insert(0, 'frontend'); import gsv_bert_tokenizer"

      - name: License files present
        run: |
          test -f LICENSE
          test -f licenses/GPT-SoVITS-LICENSE.txt
          test -f third_party/nlohmann/LICENSE.MIT
          test -f THIRD_PARTY_NOTICES.md

  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64

      - name: Service unit tests (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: scripts\run-svc-tests.bat

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          cache: true

      - name: Vulkan build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libvulkan-dev vulkan-tools glslang-tools mesa-vulkan-drivers

      - name: Fetch llama.cpp and apply ggml patch
        shell: bash
        run: |
          git clone https://github.com/ggml-org/llama.cpp llama.cpp
          git -C llama.cpp checkout "$LLAMA_CPP_COMMIT"
          git -C llama.cpp apply "${{ github.workspace }}/patches/0001-ggml-audio-patch-port-on-llamacpp.patch"

      - name: Vulkan diagnostics
        shell: bash
        run: |
          (glslc --version 2>&1 | head -3) || true
          (vulkaninfo --summary 2>&1 | head -20) || true

      - name: Build ggml (Vulkan)
        shell: bash
        run: |
          set -o pipefail
          cmake -S llama.cpp -B llama.cpp/build-vk-rel \
            -DGGML_VULKAN=ON -DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON \
            -DGGML_BUILD_TESTS=OFF -DGGML_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TOOLS=OFF -DLLAMA_BUILD_SERVER=OFF \
            -DCMAKE_BUILD_TYPE=Release 2>&1 | tee ggml-configure.log
          cmake --build llama.cpp/build-vk-rel --config Release --target ggml ggml-base ggml-cpu ggml-vulkan -j 2 2>&1 | tee ggml-build.log

      - name: Upload ggml logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gsv-buildlog-${{ runner.os }}
          path: |
            ggml-configure.log
            ggml-build.log
          if-no-files-found: ignore

      - name: Build gsv_server
        shell: bash
        run: |
          cmake -S . -B build -DGSV_GGML_LIB_DIR=llama.cpp/build-vk-rel -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --target gsv_server test_add_act test_conv_direct_act -j 4

      - name: add_act kernel test (CPU + Vulkan)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./build/Release/test_add_act.exe --cpu
          else
            ls -l /usr/share/vulkan/icd.d || true
            ls -l /usr/lib/x86_64-linux-gnu/libvulkan_lvp.so || true
            ICD=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -1)
            echo "lavapipe ICD: $ICD"
            unset VK_LAYER_PATH VK_INSTANCE_LAYERS
            VK_DRIVER_FILES="$ICD" VK_ICD_FILENAMES="$ICD" vulkaninfo --summary 2>&1 | head -60 || true
            echo "--- ldd ---"
            ldd ./build/test_add_act | grep -i vulkan || true
            echo "--- run with default loader path ---"
            VK_DRIVER_FILES="$ICD" VK_ICD_FILENAMES="$ICD" ./build/test_add_act --require-gpu || true
            echo "--- run with LD_LIBRARY_PATH override ---"
            VK_DRIVER_FILES="$ICD" VK_ICD_FILENAMES="$ICD" GGML_VK_VISIBLE_DEVICES=0 \
            LD_LIBRARY_PATH=llama.cpp/build-vk-rel/bin:llama.cpp/build-vk-rel/ggml/src:build \
            ./build/test_add_act --require-gpu
          fi

      - name: conv_direct activation test (CPU)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./build/Release/test_conv_direct_act.exe --cpu
          else
            ./build/test_conv_direct_act --cpu
          fi

      - name: Package artifact
        shell: bash
        run: |
          set -e
          mkdir -p pkg
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp build/Release/gsv_server.exe pkg/
            cp build/Release/*.dll pkg/ 2>/dev/null || true
          else
            cp build/gsv_server pkg/
            find llama.cpp/build-vk-rel -name '*.so*' -exec cp -a {} pkg/ \; 2>/dev/null || true
            chmod +x pkg/gsv_server
          fi
          ls -la pkg

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: gsv.cpp-${{ runner.os }}-x64-vulkan
          path: pkg
          if-no-files-found: error
